[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harzoo"
version = "0.1.10"
description = "Terminal agent framework with pluggable tools and TUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Harzoo Maintainers" }
]
keywords = ["agent", "tui", "tools", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=1.0.0",
  "PyYAML>=6.0",
  "textual>=8.2.8",
]

[project.urls]
Homepage = "https://www.harzoo.com"
Documentation = "https://www.harzoo.com"
Repository = "https://github.com/leeharhar/harzoo"
Issues = "https://github.com/leeharhar/harzoo/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
web = [
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
]
jupyter = [
  "jupyterlab>=4.0.0",
  "ipykernel>=6.0.0",
]
gui = [
  "pyautogui>=0.9.54",
  "pyperclip>=1.8.2",
  "pillow>=10.0.0",
]
search = [
  "httpx>=0.27.0",
]
media = [
  "pypdf>=4.0.0",
  "pillow>=10.0.0",
]
office = [
  "openpyxl>=3.1.0",
]
speech = [
  "edge-tts>=6.1.0",
]
trading = [
  "akshare>=1.14.0",
  "requests>=2.28.0",
  "pandas>=1.5.0",
]
browser = [
  "cloakbrowser>=0.4.8",
  "playwright>=1.59.0",
]
tools = [
  "cloakbrowser>=0.4.8",
  "playwright>=1.59.0",
  "pyautogui>=0.9.54",
  "pyperclip>=1.8.2",
  "pillow>=10.0.0",
  "pypdf>=4.0.0",
  "openpyxl>=3.1.0",
  "edge-tts>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project.scripts]
harzoo = "harzoo.main:main"

[tool.setuptools.packages.find]
where = ["."]
